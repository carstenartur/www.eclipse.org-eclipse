name: Verify JUnit N&N Usage Screenshots
on:
  push:
    branches: [screenshots/import-junit-nn-assets]
    paths: [.github/workflows/import-junit-nn-assets.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.repository == 'carstenartur/www.eclipse.org-eclipse'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download the reviewed SWTBot run
        uses: actions/download-artifact@v4
        with:
          repository: carstenartur/eclipse.jdt.ui
          run-id: 34767195456
          name: junit-nn-swtbot-screenshots
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .capture-artifact
      - name: Install PNG verification support
        run: python3 -m pip install 'Pillow==11.3.0'
      - name: Verify immutable documentation commits and native screenshot pixels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image

          root = 'https://api.github.com/repos/carstenartur/www.eclipse.org-eclipse'
          def read(path):
              request = Request(root + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json'})
              with urlopen(request, timeout=60) as response:
                  return json.load(response)

          captures = Path('.capture-artifact')
          reports = list(captures.rglob('TEST-*.xml'))
          assert len(reports) == 1
          report = ET.parse(reports[0]).getroot()
          assert report.get('tests') == '1'
          assert all(report.get(key) == '0' for key in ('failures', 'errors', 'skipped'))
          specifications = {
              'junit-execution-time-menu.png': (
                  'junit-execution-time-menu.png',
                  '3273787e2947709899ab599ee7e7231c5db6fc18d99f4151302c671921347532',
                  (370, 0, 642, 245), (272, 245)),
              'junit-reload-test-run.png': (
                  'junit-reload-tooltip-desktop.png',
                  '80d66814591005a01fdcc161fae3a951f52ce1bd994facc79bca91c6929a7e3e',
                  (970, 102, 1360, 184), (390, 82)),
              'junit-execution-time-details.png': (
                  'junit-execution-time-details.png',
                  '7247067366f4ad32683cab3ae172249362fe29ee5006a5bb7904df348e5b332d',
                  None, (700, 348)),
              'junit-imported-results-after-reload.png': (
                  'junit-imported-results-after-reload.png',
                  'e5ca2aec97205e8d24d25b56d01d5793eb7ff0c5a10b43fe62d712b1647cd9ce',
                  None, (700, 348)),
          }
          publications = [
              ('4e9f0f2afeb393c8c9120238cc4f66fc14485175',
               '789a08de3ea6772132e8cea0ad19b8a37863a35a',
               ['junit-execution-time-menu.png', 'junit-execution-time-details.png']),
              ('7ebadbaeec7e3dbba08f2c99a63c62385c292a5f',
               '06047e29af581ba5d03a1d2885a4058839f207e1',
               ['junit-reload-test-run.png', 'junit-imported-results-after-reload.png']),
          ]
          for commit, document_sha, names in publications:
              doc = read('/contents/news/4.42/jdt.md?ref=' + commit)
              assert doc['sha'] == document_sha
              text = base64.b64decode(doc['content']).decode()
              links = re.findall(r'!\[[^\]]*\]\(images/([^)]*)\)', text)
              assert sorted(links) == sorted(names), links
              for name in names:
                  source, digest, box, size = specifications[name]
                  matches = list(captures.rglob(source))
                  assert len(matches) == 1, source
                  raw = matches[0].read_bytes()
                  assert hashlib.sha256(raw).hexdigest() == digest, source
                  original = Image.open(io.BytesIO(raw))
                  expected = original if box is None else original.crop(box)
                  response = read('/contents/news/4.42/images/' + name + '?ref=' + commit)
                  data = base64.b64decode(response['content'])
                  image = Image.open(io.BytesIO(data))
                  assert image.size == size, name
                  assert image.convert('RGBA').tobytes() == expected.convert('RGBA').tobytes(), name
                  if box is None:
                      assert data == raw, name
                  print('Verified:', commit, name, size, 'native pixels unchanged')
          print('PASS: 1 SWTBot test; 4 verified images; 2 images per N&N; exact reviewed Markdown.')
          PY
