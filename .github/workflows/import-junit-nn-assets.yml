name: Verify Imported JUnit N&N Screenshots
on:
  push:
    branches: [screenshots/import-junit-nn-assets]
    paths: [.github/workflows/import-junit-nn-assets.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.repository == 'carstenartur/www.eclipse.org-eclipse'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download the reviewed SWTBot artifact
        uses: actions/download-artifact@v4
        with:
          repository: carstenartur/eclipse.jdt.ui
          run-id: 34762715527
          name: junit-nn-swtbot-screenshots
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .capture-artifact
      - name: Verify committed PNG bytes and Markdown references
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          # The one-time import already committed both changes. Subsequent runs
          # only verify the published result and need no repository write access.
          root = 'https://api.github.com/repos/carstenartur/www.eclipse.org-eclipse'
          def read(path):
              request = Request(root + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json'})
              with urlopen(request, timeout=60) as response:
                  return json.load(response)

          publications = [
              ('868d4740d294d359de390fc6d64c7b1993a41dc2', {
                  'junit-execution-time-details.png': '460bbc093218b49846f46a886c8963a68a431d2fc6e1403917d9b1095104bbda'}),
              ('5662b96f6bab97f2fce6470110efbd93b1247c81', {
                  'junit-imported-results-before-reload.png': '51062bc0c24dcd661ad58d3d9aecf3b07b40e46523136abbec3f34c6854e309b',
                  'junit-imported-results-after-reload.png': '98a6e75ef4464e12c171af8fe5c86ba4db8b3af3c6e5b828a3e37bd2535e9e74'}),
          ]
          for commit, images in publications:
              document = read('/contents/news/4.42/jdt.md?ref=' + commit)
              markdown = base64.b64decode(document['content']).decode('utf-8')
              for name, digest in images.items():
                  matches = list(Path('.capture-artifact').rglob(name))
                  assert len(matches) == 1, name
                  captured = matches[0].read_bytes()
                  assert hashlib.sha256(captured).hexdigest() == digest, name
                  published = read('/contents/news/4.42/images/' + name + '?ref=' + commit)
                  assert base64.b64decode(published['content']) == captured, name
                  assert markdown.count('](images/' + name + ')') == 1, name
                  print('Verified:', commit, name, digest)
          print('All three committed screenshots match the reviewed SWTBot artifact byte-for-byte.')
          PY
